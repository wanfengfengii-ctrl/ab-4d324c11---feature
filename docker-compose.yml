# 复合材料铺层序列修复工作台
# 用法：
#   docker compose up -d web                 # 启动静态 Web（默认宿主机端口 8080）
#   WEB_PORT=9000 docker compose up -d web   # 自定义宿主机端口
#   docker compose up --exit-code-from verify --abort-on-container-exit verify   # 运行验收
services:
  web:
    build:
      context: .
      target: web
    image: laminate-repair-web
    ports:
      - "${WEB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  verify:
    build:
      context: .
      target: verify
    image: laminate-repair-verify
    environment:
      WEB_URL: http://web:80
    depends_on:
      web:
        condition: service_healthy
    restart: "no"
